# Opt-in deployment profile; default.yaml remains the Stanley A/B baseline.
extends: default.yaml
control:
  controller: mpc
  mpc:
    horizon: 12
    dt_s: 0.25
    max_solve_time_s: 0.08
    max_iterations: 45
    max_speed_mps: 4.0
    min_accel_mps2: -2.0
    max_accel_mps2: 1.0
    max_steering_rad: 0.50
    max_steering_rate_rad_s: 0.40
    q_position: 3.0
    q_heading: 4.0
    q_velocity: 2.0
    r_steering: 0.3
    r_accel: 0.15
    rd_steering: 100.0
    rd_accel: 0.5
    terminal_weight: 2.0
    camera_ahead_of_rear_axle_m: 1.4
    camera_right_of_rear_axle_m: 0.0
    throttle_accel_mps2: 9.0
    brake_decel_mps2: 8.0
    rolling_decel_mps2: 0.3
